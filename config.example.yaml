thermal: null # Local loss/CUDA settings; cooling.mode air|liquid, cooling.liquid parameters, optional transient controls.

# Native CUDA magnetostatics; time scaling explicitly excludes eddy currents.
em:
  mode: quasistatic_no_eddy
  materials:
    copper:
      relative_permeability: 1.0
      conductivity_s_m: 58000000.0
    metal_composite:
      relative_permeability: 50.0
      conductivity_s_m: 1.0
    ic_epoxy_molding_compound:
      relative_permeability: 1.0
      conductivity_s_m: 1.0e-12
    silicon:
      relative_permeability: 1.0
      conductivity_s_m: null
    fr4:
      relative_permeability: 1.0
      conductivity_s_m: 1.0e-12
    air:
      relative_permeability: 1.0
      conductivity_s_m: 0.0
  source:
    use_illustrative_winding: true
    return_path_mm: null
    radial_quadrature: 2
    azimuthal_quadrature: 8
  geometry:
    include_pcb_dielectric: false # Optional existing PCB slab; passive copper is magnetically equivalent to air in this milestone.
  visualization:
    leakage_resolution: 70
    leakage_offset_mm: 0.5
    playback_interval_ms: 80
  mesh:
    size_mm: 0.65
    conductor_size_mm: 0.12
    air_padding_mm: 8.0
    air_size_mm: 2.5
  boundary:
    type: zero_tangential_A
    description: Truncated outer air box; B normal is zero. Check domain-size sensitivity.
  solver:
    max_iterations: 80000
    relative_tolerance: 1.0e-09
    absolute_tolerance: 1.0e-12
  animation:
    periods: 3
    samples_per_period: 48
    playback_interval_ms: 80
  comparison:
    relative_permeabilities:
    - 1.0
    - 10.0
    - 50.0
    - 100.0
  validation:
    loop_radius_mm: 1.0
    wire_radius_mm: 0.06
    loop_segments: 96
    current_a: 20.0
    mesh_sizes_mm:
    - 0.35
    - 0.25
    - 0.18
    air_paddings_mm:
    - 4.0
    - 8.0
    - 12.0
    axis_probe_z_over_radius:
    - 0.0
    - 0.5
    - 1.0
    max_axis_relative_error: 0.12
    max_linearity_relative_error: 1.0e-08
    max_flux_jump_relative: 1.0e-08
    max_refinement_relative_change: 0.1
    max_domain_relative_change: 0.1
    module_refined_size_mm: 0.5
    module_larger_padding_mm: 12.0
    module_probe_points_mm: [[3.0, 0.0, 2.6], [0.0, 0.0, 4.5], [0.0, -3.5, 2.6]]
    max_module_core_average_change: 0.1
    max_module_probe_change: 0.2
