  type: null
  terminal_material: null
  winding_composite_contact: null
  nominal_inductance_h: null
  winding_geometry:
    # Unknown device internals: set values only from measurements or an explicit assumption.
    topology: null # Supported: round_wire_helix; not inferred from 220 nH.
    turns: null
